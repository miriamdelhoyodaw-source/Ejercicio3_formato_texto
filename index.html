<!--TABLA 1-->
<body>
    <h2>Tabla prueba 1</h2>

                <th>columna 2</th>

            </tr>

            <tr>

                <td colspan="2">col2</td>

            <tr>
                <td>colum1</td>

            </tr>
        </tbody>
    </table>
